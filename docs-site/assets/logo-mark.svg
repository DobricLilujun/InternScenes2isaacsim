<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="SAGE-Bench">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#12203a"/>
      <stop offset="100%" stop-color="#080b16"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7CFF00"/>
    </linearGradient>
    <linearGradient id="edge2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="132" height="132" rx="30" fill="url(#bg)"
        stroke="#1c2c4d" stroke-width="1.5"/>
  <!-- circuit grid -->
  <g stroke="#16305a" stroke-width="1" opacity="0.5">
    <path d="M14 70 H126 M70 14 V126"/>
  </g>

  <!-- edges (glowing) -->
  <g stroke-width="2.4" fill="none" filter="url(#glow)" opacity="0.95">
    <path d="M70 34 L40 96" stroke="url(#edge)"/>
    <path d="M70 34 L100 96" stroke="url(#edge2)"/>
    <path d="M40 96 L100 96" stroke="url(#edge)"/>
    <path d="M70 34 L70 96" stroke="url(#edge2)" opacity="0.7"/>
    <path d="M70 96 L40 96 M70 96 L100 96" stroke="url(#edge)"/>
  </g>

  <!-- nodes -->
  <g filter="url(#glow)">
    <circle cx="70" cy="34" r="12" fill="#0b1830" stroke="#00e5ff" stroke-width="2.4"/>
    <circle cx="40" cy="96" r="9" fill="#0b1830" stroke="#7CFF00" stroke-width="2.2"/>
    <circle cx="100" cy="96" r="9" fill="#0b1830" stroke="#ff2d95" stroke-width="2.2"/>
    <circle cx="70" cy="96" r="7" fill="#0b1830" stroke="#00e5ff" stroke-width="2"/>
  </g>

  <!-- CV "sensor eye" in the top node -->
  <g transform="translate(70,34)">
    <circle r="12" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
    <circle r="4" fill="#00e5ff"/>
    <path d="M-14 0 H-8 M8 0 H14 M0 -14 V-8 M0 8 V14" stroke="#00e5ff"
          stroke-width="1.4" opacity="0.8"/>
  </g>
  <!-- node cores -->
  <g fill="#7CFF00"><circle cx="40" cy="96" r="3.2"/></g>
  <g fill="#ff2d95"><circle cx="100" cy="96" r="3.2"/></g>
  <g fill="#00e5ff"><circle cx="70" cy="96" r="2.6"/></g>
</svg>
