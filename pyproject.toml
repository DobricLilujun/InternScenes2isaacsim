[project]
name = "internscenes2isaacsim"
version = "1.0.0"
description = "Convert InternScenes 3D scenes to USD (Isaac Sim) and render perspective + top-down views, with per-scene metadata export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "InternScenes Real2Sim pipeline" }]
keywords = ["usd", "isaac-sim", "internscenes", "blender", "3d-scene", "simulation"]
dependencies = [
    "trimesh>=5.0.0",
    "open3d>=0.19.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "huggingface-hub>=0.20",
    "usd-exchange>=3.0.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
isaac = ["isaacsim"]          # install only in the Isaac Sim environment
studio = ["bpy>=4.2"]         # only when running render module inside Blender
dev = ["nbformat>=5.1.4", "nbclient>=0.10", "pytest>=8.0"]

[project.scripts]
internscenes = "internscenes.cli:main"

[project.urls]
Homepage = "https://github.com/DobricLilujun/InternScenes2isaacsim"
Repository = "https://github.com/DobricLilujun/InternScenes2isaacsim"
Documentation = "https://dobriclilujun.github.io/SAGE-Bench"

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["internscenes*"]

[tool.ruff]
line-length = 100
target-version = "py311"